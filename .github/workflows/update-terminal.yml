name: update terminal

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Recount commits and lines of code now'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/update-terminal.yml']

permissions:
  contents: write

concurrency:
  group: update-terminal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Check last update
        id: gate
        run: |
          last=$(git log -1 --format=%ct -- assets/terminal.svg || echo 0)
          age=$(( $(date +%s) - ${last:-0} ))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$age" -lt 3000 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "last update $((age / 60)) min ago, skipping"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20

      - name: Install cloc
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get install -y -qq cloc || (sudo apt-get update -qq && sudo apt-get install -y -qq cloc)

      - name: Generate terminal
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          FORCE_FULL: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.full) }}
        run: node scripts/update.mjs

      - name: Commit changes
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.svg data/stats.json
          git diff --cached --quiet || (git commit -m "chore: atualiza terminal" && git pull --rebase -q && git push)
