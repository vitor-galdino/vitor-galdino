name: update terminal

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Recount commits and lines of code now'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/update-terminal.yml']

permissions:
  contents: write

concurrency:
  group: update-terminal
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install cloc
        run: sudo apt-get install -y -qq cloc || (sudo apt-get update -qq && sudo apt-get install -y -qq cloc)

      - name: Generate terminal
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          FORCE_FULL: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.full) }}
        run: node scripts/update.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.svg data/stats.json
          git diff --cached --quiet || (git commit -m "chore: update terminal" && git pull --rebase -q && git push)
