name: update terminal

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Recount commits and lines of code now'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/update-terminal.yml']

permissions:
  contents: write

concurrency:
  group: update-terminal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load previous output
        id: gate
        run: |
          mkdir -p out
          last=0
          if git fetch -q --depth=1 origin output 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C out
            last=$(git log -1 --format=%ct FETCH_HEAD)
          fi
          age=$(( $(date +%s) - last ))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$age" -lt 3000 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "last update $((age / 60)) min ago, skipping"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20

      - name: Install cloc
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get install -y -qq cloc || (sudo apt-get update -qq && sudo apt-get install -y -qq cloc)

      - name: Generate terminal
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: out
          FORCE_FULL: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.full) }}
        run: node scripts/update.mjs

      - name: Publish to output branch
        if: steps.gate.outputs.run == 'true'
        run: |
          auth=$(git config --get http.https://github.com/.extraheader)
          cd out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "$auth"
          git add terminal.svg stats.json
          git commit -q -m "chore: update terminal"
          git push -q --force "https://github.com/${{ github.repository }}.git" output
